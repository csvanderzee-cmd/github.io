<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0B0E14">
    <!-- Not linked from the site yet. noindex keeps it out of search while it is a work in progress. -->
    <meta name="robots" content="noindex">
    <title>Smash Tournament | PSD Esports</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        esports: {
                            dark: '#0B0E14',
                            card: '#151B26',
                            yellow: '#FDB913',
                            'yellow-text': '#FFD166',
                            red: '#C8102E',
                            'red-text': '#FF6B6B',
                            blue: '#005696',
                            'blue-text': '#4DABF7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel { background: rgba(21, 27, 38, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .clip-slant { clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0B0E14; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; border: 2px solid #0B0E14; }

        /* ---- division tabs ---- */
        .div-tab { font-family:'Rajdhani',sans-serif; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
                   padding:.55rem 1.4rem; border-radius:9999px; font-size:.8rem; color:#9ca3af; cursor:pointer;
                   border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); transition:all .18s; }
        .div-tab:hover { color:#fff; background:rgba(255,255,255,.08); }
        .div-tab.active { color:#0B0E14; background:var(--accent,#FDB913); border-color:var(--accent,#FDB913); }

        /* ---- group standings ---- */
        .grp-table { width:100%; border-collapse:collapse; font-size:.8rem; }
        .grp-table th { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:.6rem; letter-spacing:.16em;
                        text-transform:uppercase; color:#6b7280; text-align:right; padding:.4rem .35rem; }
        /* position and team name read left; every stat column reads right */
        .grp-table th:first-child,    .grp-table td:first-child,
        .grp-table th:nth-child(2),   .grp-table td:nth-child(2) { text-align:left; }
        .grp-table td { padding:.5rem .35rem; text-align:right; border-top:1px solid rgba(255,255,255,.06);
                        color:#d1d5db; font-variant-numeric:tabular-nums; }
        .grp-table tr.qualified td { background:linear-gradient(90deg, rgba(253,185,19,.09), transparent); }
        .grp-table tr.qualified td:first-child { box-shadow:inset 3px 0 0 #FDB913; }
        .grp-table .pos { color:#4b5563; width:1.4rem; }
        .grp-table .nm { color:#fff; font-weight:600; }
        .grp-table .pts { color:#fff; font-weight:800; }

        /* ---- fixtures ---- */
        .fix-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem; width:100%;
                   padding:.45rem .6rem; border-radius:.5rem; border:1px solid rgba(255,255,255,.05);
                   background:rgba(255,255,255,.02); text-align:left; transition:border-color .15s, background .15s; }
        .fix-row .side { font-size:.78rem; color:#9ca3af; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .fix-row .side.right { text-align:right; }
        .fix-row .side.won { color:#fff; font-weight:700; }
        .fix-score { font-family:'Rajdhani',sans-serif; font-weight:900; font-size:.85rem; letter-spacing:.05em;
                     color:#6b7280; background:rgba(255,255,255,.05); padding:.1rem .5rem; border-radius:.3rem; white-space:nowrap; }
        .fix-score.done { color:#FFD166; background:rgba(253,185,19,.12); }

        /* ---- bracket ----
           Each round is a flex column of equal-height slots, so a match always sits at the
           vertical midpoint of the two matches feeding it. Connectors are drawn in the 3rem
           gutter between rounds: a 1.5rem stub out of each match, a vertical line joining
           each pair, and a 1.5rem stub into the match that follows. */
        .bracket { display:flex; overflow-x:auto; padding:1rem .25rem 1.5rem; align-items:stretch; }
        .bk-round { flex:0 0 235px; display:flex; flex-direction:column; margin-right:3rem; }
        .bk-round:last-child { margin-right:0; }
        .bk-round-title { font-family:'Rajdhani',sans-serif; font-weight:800; font-size:.62rem; letter-spacing:.22em;
                          text-transform:uppercase; color:#6b7280; text-align:center; padding-bottom:.75rem; }
        .bk-body { flex:1; display:flex; flex-direction:column; }
        .bk-slot { flex:1; display:flex; align-items:center; position:relative; min-height:78px; }
        .bk-round:not(:last-child) .bk-slot::after,
        .bk-round:not(:first-child) .bk-slot::before {
            content:''; position:absolute; top:50%; width:1.5rem; height:2px; background:rgba(255,255,255,.13);
        }
        .bk-round:not(:last-child) .bk-slot::after { left:100%; }
        .bk-round:not(:first-child) .bk-slot::before { right:100%; }
        .bk-conn { position:absolute; left:calc(100% + 1.5rem); top:50%; width:2px; height:100%;
                   background:rgba(255,255,255,.13); display:none; }
        .bk-round:not(:last-child) .bk-slot:nth-child(odd) .bk-conn { display:block; }
        .bk-match { width:100%; background:#151B26; border:1px solid rgba(255,255,255,.07);
                    border-radius:.6rem; overflow:hidden; text-align:left; transition:border-color .15s; }
        .bk-team { display:flex; align-items:center; gap:.5rem; padding:.45rem .6rem; font-size:.78rem; color:#9ca3af; }
        .bk-team + .bk-team { border-top:1px solid rgba(255,255,255,.06); }
        .bk-team .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .bk-team .sc { font-family:'Rajdhani',sans-serif; font-weight:900; color:#4b5563; font-variant-numeric:tabular-nums; }
        .bk-team.won { color:#fff; font-weight:700; background:rgba(253,185,19,.07); }
        .bk-team.won .sc { color:#FFD166; }
        .bk-team.tbd { color:#4b5563; font-style:italic; }
        .bk-match.final-match { border-color:rgba(253,185,19,.45); box-shadow:0 0 26px rgba(253,185,19,.13); }

        /* ---- live feed status ---- */
        .feed-dot { width:7px; height:7px; border-radius:50%; background:#4b5563; flex-shrink:0; }
        .feed-dot.live    { background:#34d399; box-shadow:0 0 0 0 rgba(52,211,153,.5); animation:feed-pulse 2.4s infinite; }
        .feed-dot.loading { background:#FDB913; animation:feed-blink .9s infinite; }
        .feed-dot.stale   { background:#FDB913; }
        .feed-dot.error   { background:#FF6B6B; }
        .feed-dot.off     { background:#4b5563; }
        @keyframes feed-pulse { 70% { box-shadow:0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow:0 0 0 0 rgba(52,211,153,0); } }
        @keyframes feed-blink { 50% { opacity:.35; } }
        @media (prefers-reduced-motion: reduce) {
            .feed-dot.live, .feed-dot.loading { animation:none; }
        }

        /* station / start time under a fixture, when the sheet supplies them */
        .fix-meta { font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:#4b5563;
                    font-family:'Rajdhani',sans-serif; font-weight:700; padding:.15rem .6rem 0; }

        @media print {
            #psd-nav, #psd-nav-drawer, .no-print { display:none !important; }
            body { background:#fff; color:#000; }
            .bracket { overflow:visible; }
        }
    </style>
</head>

<body class="bg-esports-dark text-gray-100 font-sans antialiased selection:bg-esports-blue">

<script src="/data/psd-nav.js"></script>
<script>PSD_NAV.init('smash');</script>

    <header role="banner" class="relative py-16 overflow-hidden border-b border-white/10">
        <div aria-hidden="true" class="absolute inset-0 bg-gradient-to-br from-esports-blue/20 via-transparent to-esports-red/20"></div>
        <div class="relative max-w-7xl mx-auto px-4 z-20">
            <div class="inline-block px-4 py-1 bg-esports-yellow text-black font-display font-black uppercase tracking-widest text-sm clip-slant mb-6">
                One-Day Tournament
            </div>
            <h1 class="font-display font-black text-5xl md:text-7xl uppercase leading-[0.85] mb-4 italic">
                Super Smash Bros.<br/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-esports-blue-text via-esports-yellow-text to-esports-red-text">Tournament</span>
            </h1>
            <p class="text-lg text-gray-400 font-display font-bold tracking-[0.2em] uppercase">
                Palmdale School District &nbsp;·&nbsp; Group Stage + Knockout
            </p>

            <div class="mt-8 flex flex-wrap gap-2 text-[11px] font-display font-bold uppercase tracking-widest">
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">2v2 Doubles</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">Best of 3</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">3 Stock · 6 Min</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">Battlefield Only</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">Items Off</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">Team Damage On</span>
                <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-gray-300">Stock Sharing On</span>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-16">
        <p class="text-[10px] font-display font-bold uppercase tracking-[0.3em] text-gray-600 mb-6">Choose a division</p>
        <div id="division-links" class="grid gap-6 md:grid-cols-2"></div>

        <p class="text-center text-[11px] text-gray-700 pt-16">
            Draft pages — not linked from the PSD Esports site yet.
        </p>
    </div>

<script src="../data/smash.js"></script>
<script>
(function () {
    'use strict';
    /* The two divisions are run and drawn separately, so each gets its own
       page. This is just the signpost to them, built from the same config so
       a division can never appear here without a page behind it. */
    var CFG = window.SMASH && window.SMASH.config;
    var host = document.getElementById('division-links');
    if (!CFG || !host) return;

    host.innerHTML = CFG.divisions.map(function (d) {
        var ready = !!d.gid;
        return '<a href="' + d.page + '" class="block bg-esports-card border rounded-2xl p-8 transition-colors hover:bg-white/[0.04]"' +
               ' style="border-color:' + d.accent + '44">' +
               '<p class="font-display text-3xl font-black uppercase italic mb-2" style="color:' + d.accent + '">' +
                 d.name.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
               '</p>' +
               '<p class="text-sm text-gray-500">' +
                 (ready ? 'Group tables and elimination bracket' : 'Not set up yet') +
               '</p></a>';
    }).join('');
})();
</script>
</body>
</html>

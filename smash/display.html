<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <meta name="theme-color" content="#0B0E14">
    <!-- An operations screen for the day itself, not a page to find in search. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Tournament Display | PSD Esports</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* ======================================================================
           BIG SCREEN DISPLAY

           One screenful, never a scrollbar. The content is laid out at a fixed
           design width and then scaled to whatever the screen actually is, so
           four groups of four and ten groups of three both land on the glass
           without anyone touching a setting.
           ====================================================================== */

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; height: 100%; overflow: hidden;
            background: #0B0E14; color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #screen { height: 100%; display: flex; flex-direction: column; padding: 1.1vmin 1.6vmin; }

        /* ---- top bar ---- */
        .top { display: flex; align-items: center; gap: 1.2rem; flex-shrink: 0; padding-bottom: .9vmin;
               border-bottom: 1px solid rgba(255,255,255,.1); }
        .badge { font-family: 'Rajdhani', sans-serif; font-weight: 900; text-transform: uppercase;
                 letter-spacing: .1em; color: #0B0E14; background: var(--accent, #FDB913);
                 padding: .25em .9em; font-size: clamp(.9rem, 1.7vmin, 1.6rem);
                 clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%); }
        .view-name { font-family: 'Rajdhani', sans-serif; font-weight: 900; font-style: italic;
                     text-transform: uppercase; letter-spacing: .02em; color: #fff;
                     font-size: clamp(1.1rem, 2.6vmin, 2.6rem); line-height: 1; }
        .top-right { margin-left: auto; display: flex; align-items: center; gap: 1.1rem;
                     font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .14em; font-size: clamp(.6rem, 1.25vmin, 1.1rem); color: #9ca3af; }
        .clock { color: #fff; font-weight: 900; letter-spacing: .06em; }
        .dot { width: .9vmin; height: .9vmin; min-width: 7px; min-height: 7px; border-radius: 50%;
               background: #4b5563; display: inline-block; }
        .dot.live { background: #34d399; }
        .dot.stale, .dot.loading { background: #FDB913; }
        .dot.error { background: #FF6B6B; }

        /* ---- the scaled stage ---- */
        #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
                 overflow: hidden; }
        #fit { width: 1600px; flex: 0 0 auto; transform-origin: center center; }

        /* ---- groups ---- */
        .groups { display: grid; gap: 22px; }
        .gcard { background: #151B26; border: 1px solid rgba(255,255,255,.08);
                 border-top: 3px solid var(--accent, #FDB913); border-radius: 14px; padding: 16px 18px 12px; }
        .ghead { display: flex; align-items: baseline; gap: .6rem; margin-bottom: 10px; }
        .gname { font-family: 'Rajdhani', sans-serif; font-weight: 900; font-style: italic;
                 text-transform: uppercase; font-size: 1.5rem; color: #fff; line-height: 1; }
        .gtag { margin-left: auto; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: .72rem;
                letter-spacing: .18em; text-transform: uppercase; color: #6b7280; }
        .gtag.done { color: #FFD166; }

        table { width: 100%; border-collapse: collapse; }
        th { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: .72rem; letter-spacing: .16em;
             text-transform: uppercase; color: #6b7280; text-align: right; padding: 0 4px 6px; }
        th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
        td { padding: 7px 4px; text-align: right; border-top: 1px solid rgba(255,255,255,.07);
             color: #d1d5db; font-variant-numeric: tabular-nums; font-size: 1.15rem; }
        tr.q td { background: linear-gradient(90deg, rgba(253,185,19,.1), transparent); }
        tr.q td:first-child { box-shadow: inset 3px 0 0 #FDB913; }
        .pos { color: #4b5563; width: 2rem; }
        .nm { color: #fff; font-weight: 700; }
        .pts { color: #fff; font-weight: 800; }

        /* ---- bracket ---- */
        .bracket { display: flex; align-items: stretch; justify-content: center; }
        .bk-round { flex: 0 0 300px; display: flex; flex-direction: column; margin-right: 4rem; }
        .bk-round:last-child { margin-right: 0; }
        .bk-title { font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: .85rem;
                    letter-spacing: .22em; text-transform: uppercase; color: #6b7280;
                    text-align: center; padding-bottom: 14px; }
        .bk-body { flex: 1; display: flex; flex-direction: column; }
        .bk-slot { flex: 1; display: flex; align-items: center; position: relative; min-height: 96px; }
        .bk-round:not(:last-child) .bk-slot::after,
        .bk-round:not(:first-child) .bk-slot::before {
            content: ''; position: absolute; top: 50%; width: 2rem; height: 2px; background: rgba(255,255,255,.14);
        }
        .bk-round:not(:last-child) .bk-slot::after { left: 100%; }
        .bk-round:not(:first-child) .bk-slot::before { right: 100%; }
        .bk-conn { position: absolute; left: calc(100% + 2rem); top: 50%; width: 2px; height: 100%;
                   background: rgba(255,255,255,.14); display: none; }
        .bk-round:not(:last-child) .bk-slot:nth-child(odd) .bk-conn { display: block; }
        .bk-match { width: 100%; background: #151B26; border: 1px solid rgba(255,255,255,.08);
                    border-radius: 10px; overflow: hidden; }
        .bk-team { display: flex; align-items: center; gap: .6rem; padding: 9px 12px;
                   font-size: 1.1rem; color: #9ca3af; }
        .bk-team + .bk-team { border-top: 1px solid rgba(255,255,255,.07); }
        .bk-team .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bk-team .s { font-family: 'Rajdhani', sans-serif; font-weight: 900; color: #4b5563;
                      font-variant-numeric: tabular-nums; font-size: 1.25rem; }
        .bk-team.won { color: #fff; font-weight: 800; background: rgba(253,185,19,.08); }
        .bk-team.won .s { color: #FFD166; }
        .bk-team.tbd { color: #4b5563; font-style: italic; }
        .bk-match.final { border-color: rgba(253,185,19,.5); box-shadow: 0 0 30px rgba(253,185,19,.15); }
        .third { margin-top: 26px; text-align: center; }
        .third-label { font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: .8rem;
                       letter-spacing: .22em; text-transform: uppercase; color: #6b7280; margin-bottom: 10px; }
        .third .bk-match { max-width: 300px; margin: 0 auto; }

        /* ---- champion ---- */
        .champ { text-align: center; margin-top: 26px; }
        .champ-label { font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: .85rem;
                       letter-spacing: .26em; text-transform: uppercase; color: #FFD166; }
        .champ-name { font-family: 'Rajdhani', sans-serif; font-weight: 900; font-style: italic;
                      text-transform: uppercase; font-size: 3rem; color: #fff; line-height: 1.1; }

        /* ---- waiting / empty ---- */
        .waiting { text-align: center; padding: 80px 0; }
        .waiting h2 { font-family: 'Rajdhani', sans-serif; font-weight: 900; font-style: italic;
                      text-transform: uppercase; font-size: 2.6rem; color: #fff; margin: 0 0 12px; }
        .waiting p { color: #6b7280; font-size: 1.2rem; margin: 0; }

        /* ---- bottom bar ---- */
        .bottom { flex-shrink: 0; display: flex; align-items: center; gap: 1rem; padding-top: .9vmin;
                  border-top: 1px solid rgba(255,255,255,.1);
                  font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase;
                  letter-spacing: .16em; font-size: clamp(.6rem, 1.25vmin, 1.05rem); color: #6b7280; }
        .switch { margin-left: auto; display: flex; gap: .5rem; }
        .switch button { font: inherit; letter-spacing: .14em; color: #9ca3af; cursor: pointer;
                         background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
                         border-radius: 9999px; padding: .45em 1.3em; transition: all .15s; }
        .switch button:hover { color: #fff; background: rgba(255,255,255,.1); }
        .switch button[aria-pressed="true"] { color: #0B0E14; background: var(--accent, #FDB913);
                                              border-color: var(--accent, #FDB913); }
        .switch button:focus-visible { outline: 3px solid #FFD166; outline-offset: 2px; }
        .hint { color: #4b5563; }

        @media (max-width: 700px) { .hint { display: none; } }
    </style>
</head>
<body>

<div id="screen">
    <div class="top">
        <span class="badge" id="badge">Division</span>
        <span class="view-name" id="view-name">Group Stage</span>
        <div class="top-right">
            <span id="where"></span>
            <span><span class="dot" id="dot"></span> <span id="feed">Loading</span></span>
            <span class="clock" id="clock"></span>
        </div>
    </div>

    <div id="stage">
        <div id="fit"></div>
    </div>

    <div class="bottom">
        <span id="legend">Round robin &middot; Win = 3 points</span>
        <span class="hint">Press &larr; &rarr; or space to switch</span>
        <div class="switch">
            <button type="button" id="btn-groups" aria-pressed="true">Round Robin</button>
            <button type="button" id="btn-bracket" aria-pressed="false">Bracket</button>
        </div>
    </div>
</div>

<script src="/data/smash.js"></script>
<script src="/data/smash-bracket.js"></script>
<script>
(function () {
    'use strict';

    var params = new URLSearchParams(location.search);
    var divisionId = params.get('d') || params.get('division') || 'jr';

    /* View rules:
         - "auto" follows the tournament: round robin while groups are being
           played, the bracket once every group game is in.
         - Pressing a button pins that view until the page is reloaded, so a
           screen someone deliberately set does not change under them. */
    var view = params.get('view') || 'auto';   // auto | groups | bracket
    var pinned = view !== 'auto';
    var last = null;

    function $(id) { return document.getElementById(id); }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    /* ---- fit the content to the glass ----------------------------------
       The stage is drawn at a fixed 1600px width, then scaled until it fills
       the screen in whichever direction runs out first. A sparse bracket grows
       so it reads from the back of the room; sixteen teams of group tables
       shrink until they fit. Either way nothing is cut off and nothing
       scrolls. The ceiling keeps a two-team bracket from going comical. */
    var MAX_SCALE = 2.4;

    function fit() {
        var stage = $('stage'), inner = $('fit');
        if (!stage || !inner) return;
        inner.style.transform = 'scale(1)';
        var w = inner.scrollWidth, h = inner.scrollHeight;
        if (!w || !h) return;
        var scale = Math.min(stage.clientWidth / w, stage.clientHeight / h, MAX_SCALE);
        inner.style.transform = 'scale(' + scale + ')';
    }

    /* ---- drawing ---- */

    function waiting(title, body) {
        return '<div class="waiting"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p></div>';
    }

    var COL_W = 460, COL_GAP = 22;

    function groupsHtml(snap, cols) {
        if (!snap.groups.length) {
            return { html: waiting('Groups not posted yet', 'They appear here as soon as the draw is in the sheet.'),
                     width: '1200px' };
        }
        var cards = snap.groups.map(function (g) {
            var rows = g.rows.map(function (r, i) {
                return '<tr class="' + (i < snap.advance ? 'q' : '') + '">' +
                    '<td class="pos">' + (i + 1) + '</td>' +
                    '<td class="nm">' + esc(r.name) + '</td>' +
                    '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.l + '</td>' +
                    '<td>' + (r.sd > 0 ? '+' : '') + r.sd + '</td>' +
                    '<td class="pts">' + r.pts + '</td></tr>';
            }).join('');
            return '<div class="gcard">' +
                '<div class="ghead"><span class="gname">' + esc(g.name) + '</span>' +
                  '<span class="gtag' + (g.complete ? ' done' : '') + '">' +
                    (g.complete ? 'Complete' : g.rows.length + ' teams') + '</span></div>' +
                '<table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>SD</th><th>Pts</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        }).join('');
        return {
            html: '<div class="groups" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' +
                  cards + '</div>',
            // Two groups should not be stretched across a sheet built for four:
            // the block is only as wide as its columns, and the scaler does the rest.
            width: (cols * COL_W + (cols - 1) * COL_GAP) + 'px'
        };
    }

    /* How many columns the groups go in is decided by trying them: a wide
       screen reads four groups best in one row, a squarer one in two rows of
       two. Whichever arrangement ends up largest on this screen wins. */
    function drawGroups(snap) {
        var inner = $('fit'), stage = $('stage');
        var n = snap.groups.length || 1;
        var best = null;

        for (var cols = 1; cols <= Math.min(n, 4); cols++) {
            var g = groupsHtml(snap, cols);
            inner.style.width = g.width;
            inner.innerHTML = g.html;
            inner.style.transform = 'scale(1)';
            var w = inner.scrollWidth, h = inner.scrollHeight;
            if (!w || !h) continue;
            var scale = Math.min(stage.clientWidth / w, stage.clientHeight / h, MAX_SCALE);
            if (!best || scale > best.scale) best = { scale: scale, html: g.html, width: g.width };
        }

        if (!best) { fit(); return; }
        inner.style.width = best.width;
        inner.innerHTML = best.html;
        inner.style.transform = 'scale(' + best.scale + ')';
    }

    function teamRow(name, hint, score, winner) {
        var known = name && name !== '';
        var won = known && winner && winner === name;
        return '<div class="bk-team' + (won ? ' won' : '') + (known ? '' : ' tbd') + '">' +
            '<span class="t">' + esc(known ? name : (hint || 'TBD')) + '</span>' +
            '<span class="s">' + (score === null || score === undefined ? '' : score) + '</span></div>';
    }

    function matchHtml(m, isFinal) {
        var show = m.done || (m.scoreA + m.scoreB) > 0;
        var h = m.hints || [];
        return '<div class="bk-match' + (isFinal ? ' final' : '') + '">' +
            teamRow(m.teams[0], h[0], show ? m.scoreA : null, m.winner) +
            teamRow(m.teams[1], h[1], show ? m.scoreB : null, m.winner) +
            '</div>';
    }

    function bracketHtml(snap) {
        var b = snap.bracket;
        if (!b || !b.rounds.length) {
            return waiting('Bracket not drawn yet', 'The knockout rounds appear here once the groups are done.');
        }
        var html = '<div class="bracket">' + b.rounds.map(function (rd, ri) {
            var isLast = ri === b.rounds.length - 1;
            return '<div class="bk-round"><div class="bk-title">' + esc(rd.name) + '</div><div class="bk-body">' +
                rd.matches.map(function (m) {
                    return '<div class="bk-slot">' + matchHtml(m, isLast) + '<span class="bk-conn"></span></div>';
                }).join('') + '</div></div>';
        }).join('') + '</div>';

        if (b.third) {
            html += '<div class="third"><div class="third-label">Third Place</div>' +
                    matchHtml(b.third, false) + '</div>';
        }

        // Once the final is decided, the champion is the thing worth reading
        // from the back of the room.
        var finalRound = b.rounds[b.rounds.length - 1];
        var fin = finalRound && finalRound.matches.length === 1 ? finalRound.matches[0] : null;
        if (fin && fin.done && fin.winner) {
            html += '<div class="champ"><div class="champ-label">Champions</div>' +
                    '<div class="champ-name">' + esc(fin.winner) + '</div></div>';
        }
        return html;
    }

    function paint(snap) {
        last = snap;

        if (!pinned) view = snap.groupsComplete && snap.bracket ? 'bracket' : 'groups';

        $('badge').textContent = snap.division.name;
        document.documentElement.style.setProperty('--accent', snap.division.accent);
        $('badge').style.background = snap.division.accent;

        var showing = view === 'bracket' ? 'bracket' : 'groups';
        $('view-name').textContent = showing === 'bracket' ? 'Elimination Bracket' : 'Group Stage';
        $('legend').innerHTML = showing === 'bracket'
            ? 'Single elimination &middot; Best of 3'
            : 'Round robin &middot; Win = 3 points &middot; Top ' + snap.advance + ' advance';

        $('btn-groups').setAttribute('aria-pressed', String(showing === 'groups'));
        $('btn-bracket').setAttribute('aria-pressed', String(showing === 'bracket'));

        var dot = $('dot'), feed = $('feed');
        if (!snap.wired)            { dot.className = 'dot';         feed.textContent = 'No sheet'; }
        else if (snap.error && !snap.hasData) { dot.className = 'dot error'; feed.textContent = 'No connection'; }
        else if (snap.error)        { dot.className = 'dot stale';   feed.textContent = 'Reconnecting'; }
        else if (snap.loading && !snap.hasData) { dot.className = 'dot loading'; feed.textContent = 'Loading'; }
        else                        { dot.className = 'dot live';    feed.textContent = 'Live'; }

        /* Group tables need a width to lay their columns out in; a bracket is
           as wide as it is, and saying so lets it scale up to fill the glass. */
        var inner = $('fit');
        if (showing === 'bracket') {
            inner.style.width = 'max-content';
            inner.innerHTML = bracketHtml(snap);
            fit();
        } else {
            drawGroups(snap);
        }
    }

    function show(which) {
        pinned = true;
        view = which;
        if (last) paint(last);
    }

    $('btn-groups').addEventListener('click', function () { show('groups'); });
    $('btn-bracket').addEventListener('click', function () { show('bracket'); });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            show(view === 'bracket' ? 'groups' : 'bracket');
        }
    });

    // A resize can change which arrangement reads largest, so redraw, not just rescale.
    window.addEventListener('resize', function () { if (last) paint(last); else fit(); });

    function tick() {
        $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 20000);

    var division = SMASH_PAGE.initDisplay(divisionId, paint);
    if (!division) {
        $('fit').innerHTML = waiting('Unknown division', 'Add ?d=jr or ?d=sr to the address.');
        fit();
    } else {
        var c = SMASH.config;
        $('where').textContent = [c.venue, c.startTime].filter(Boolean).join(' · ');
    }
})();
</script>
</body>
</html>
